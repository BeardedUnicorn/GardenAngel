[package]
name = "gardenangel"
version = "0.1.0"
description = "Permaculture-oriented backyard garden planner"
authors = ["Michael Herold"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
# OS keychain for the coach API key (ADR-001: keyring over stronghold).
# macOS-only v0.1 -> apple-native backend; mock backend used in tests.
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
